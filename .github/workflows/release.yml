name: Package Chatter

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  macos-arm64:
    runs-on: macos-14
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A hung step (see git history — resolved) once burned 6 hours of
    # runner time before GitHub's own default limit stepped in. This build
    # normally finishes in a few minutes — fail fast instead of that again.
    timeout-minutes: 15
    env:
      KEYCHAIN_PATH: ${{ github.workspace }}/chatter-release.keychain-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Gives this CI runner the same kind of stable signing identity that
      # packaging/setup_dev_cert.sh gives a local checkout. Without it, every
      # release would be ad-hoc signed with a fresh random identity, and
      # updating Chatter would silently reset every user's Accessibility/
      # Microphone/Input Monitoring grants — the same bug fixed for local
      # builds, but hitting real users instead. The certificate and its
      # import password live only in this repo's encrypted Actions secrets;
      # the private key touches disk only inside this ephemeral runner's
      # temp keychain, which is deleted at the end of the job regardless of
      # outcome.
      - name: Import release signing certificate
        env:
          CERT_P12_B64: ${{ secrets.CHATTER_RELEASE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CHATTER_RELEASE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/chatter-release-cert.p12"

          echo "$CERT_P12_B64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # -T pre-authorizes codesign/security specifically, which is
          # enough for codesign to actually use the key — no partition-list
          # or trust-settings step needed. (An earlier version of this step
          # tried set-key-partition-list and then security add-trusted-cert
          # to chase a "certificate not found" warning from build_app.sh;
          # both hung indefinitely waiting on a GUI authorization prompt
          # nothing can answer on a headless runner, once for 6 hours before
          # GitHub's own limit intervened. Neither was actually needed: that
          # warning was build_app.sh's own `find-identity -v` filtering out
          # every self-signed cert by trust chain, not a real signing
          # failure — fixed there instead, see packaging/build_app.sh.)
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

      - name: Build the app
        env:
          CHATTER_CODESIGN_IDENTITY: "Chatter Release"
          CHATTER_VERSION: ${{ github.ref_name }}
          CHATTER_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements.txt
          venv/bin/python -m unittest discover -s tests -q
          ./packaging/build_app.sh

      - name: Verify app version matches release tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Chatter.app/Contents/Info.plist)"
          test "$actual" = "$expected"

      - name: Create DMG
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          cp -R Chatter.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          # hdiutil create right after a fresh cp -R is a known flaky combo
          # on GitHub's macOS runners — Spotlight briefly holds a handle on
          # the just-written files and create fails with "Resource busy".
          # Harmless and transient; retry instead of treating it as real.
          for attempt in 1 2 3; do
            if hdiutil create -volname "Chatter" -srcfolder "$STAGING" -ov -format UDZO Chatter-macOS-arm64.dmg; then
              break
            fi
            [ "$attempt" -eq 3 ] && exit 1
            echo "hdiutil create failed (attempt $attempt), retrying in 5s..."
            sleep 5
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Chatter-macOS-arm64.dmg --title "Chatter $GITHUB_REF_NAME" --generate-notes

      - name: Update landing page to this release
        env:
          CHATTER_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B release-page origin/main
          python packaging/update_release_page.py "$CHATTER_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Landing page already points to $CHATTER_VERSION"
          else
            git commit -m "docs: point download page to $CHATTER_VERSION"
            git push origin HEAD:main
          fi

      # The release job already has the Pages permissions it needs. Deploying
      # here avoids trying to dispatch pages.yml with GITHUB_TOKEN, which
      # GitHub intentionally rejects with HTTP 403 to prevent workflow loops.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload landing page artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy landing page
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
