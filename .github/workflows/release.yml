name: Package Chatter

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    # A signing step hanging on an unanswerable GUI prompt once burned 6
    # hours of runner time before GitHub's own default limit stepped in.
    # This build normally finishes in a few minutes — fail fast instead.
    timeout-minutes: 20
    env:
      KEYCHAIN_PATH: ${{ github.workspace }}/chatter-release.keychain-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Gives this CI runner the same kind of stable signing identity that
      # packaging/setup_dev_cert.sh gives a local checkout. Without it, every
      # release would be ad-hoc signed with a fresh random identity, and
      # updating Chatter would silently reset every user's Accessibility/
      # Microphone/Input Monitoring grants — the same bug fixed for local
      # builds, but hitting real users instead. The certificate and its
      # import password live only in this repo's encrypted Actions secrets;
      # the private key touches disk only inside this ephemeral runner's
      # temp keychain, which is deleted at the end of the job regardless of
      # outcome.
      - name: Import release signing certificate
        env:
          CERT_P12_B64: ${{ secrets.CHATTER_RELEASE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CHATTER_RELEASE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/chatter-release-cert.p12"

          echo "$CERT_P12_B64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # -A (instead of -T per-tool trust + set-key-partition-list) grants
          # every process blanket access to the imported key. That would be
          # too broad on a real, always-on Mac, but this keychain is created
          # fresh for this one job and destroyed at the end of it, so there's
          # nothing else on the machine for the broader grant to expose.
          # set-key-partition-list is the CLI-only path to the same narrow
          # trust packaging/setup_dev_cert.sh uses locally, and it is known
          # to hang waiting on a GUI authorization prompt that can never be
          # answered on a headless CI runner — it hung silently for 6 hours
          # here before GitHub force-killed the job.
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -A
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
              "$(security list-keychains -d user | sed 's/"//g' | xargs)"

          # Importing the identity is not enough — `security find-identity -v`
          # (what build_app.sh checks) only lists identities it considers
          # "valid", and a self-signed cert with no trusted root needs to be
          # explicitly marked as trusted for code signing before it counts.
          #
          # macOS's system openssl is LibreSSL, which has no -legacy flag at
          # all (it never gated legacy algorithms behind one); a newer
          # OpenSSL 3.x, like the one used to originally export this p12,
          # needs -legacy to read the same legacy-format archive. Detect
          # which one this runner has instead of hardcoding either.
          LEGACY_FLAG=""
          openssl pkcs12 -help 2>&1 | grep -q -- "-legacy" && LEGACY_FLAG="-legacy"
          CERT_ONLY_PATH="$RUNNER_TEMP/chatter-release-cert.crt"
          openssl pkcs12 -in "$CERT_PATH" -clcerts -nokeys -passin "pass:$CERT_PASSWORD" $LEGACY_FLAG \
              | openssl x509 -out "$CERT_ONLY_PATH"
          security add-trusted-cert -p codeSign -k "$KEYCHAIN_PATH" "$CERT_ONLY_PATH"

          rm -f "$CERT_PATH" "$CERT_ONLY_PATH"

      - name: Build the app
        env:
          CHATTER_CODESIGN_IDENTITY: "Chatter Release"
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements.txt
          ./packaging/build_app.sh

      - name: Create DMG
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          cp -R Chatter.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Chatter" -srcfolder "$STAGING" -ov -format UDZO Chatter-macOS-arm64.dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Chatter-macOS-arm64.dmg --title "Chatter $GITHUB_REF_NAME" --generate-notes

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
